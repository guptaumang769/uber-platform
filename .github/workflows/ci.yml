name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: '**/surefire-reports/*.xml'
          reporter: java-junit

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        service:
          - api-gateway
          - config-server
          - discovery-server
          - driver-service
          - location-service
          - matching-service
          - notification-service
          - payment-service
          - pricing-service
          - rider-service
          - trip-service
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} Docker image
        run: docker build -f ./${{ matrix.service }}/Dockerfile -t uber-${{ matrix.service }}:${{ github.sha }} .
