server:
  port: 8085

spring:
  application:
    name: pricing-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

uber:
  pricing:
    base-fare: ${PRICING_BASE_FARE:30.0}
    per-km-rate: ${PRICING_PER_KM_RATE:12.0}
    max-surge: ${PRICING_MAX_SURGE:3.0}
    demand-window-seconds: ${PRICING_DEMAND_WINDOW_SECONDS:300}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
