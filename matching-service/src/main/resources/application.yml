server:
  port: 8084

spring:
  application:
    name: matching-service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}"
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

uber:
  matching:
    lock-ttl-ms: ${MATCH_LOCK_TTL_MS:15000}
    search-radius-km: ${MATCH_SEARCH_RADIUS_KM:5.0}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

# Circuit breaker on the /nearby call to location-service. Fail-open with an empty candidate list.
resilience4j:
  circuitbreaker:
    instances:
      locationService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
