# Full Uber stack: Postgres (4 DBs) + Redis + Kafka + 11 Spring services.
#   docker compose up -d --build
#
# ⚠️ Heavy: Kafka + Redis + Postgres + 11 JVMs want ~6-8 GB RAM. Give Docker Desktop
# enough memory. To run lighter, bring up infra + a subset (e.g. rider, driver,
# location, matching, trip, notification) to demo the core ride flow.

services:
  # ---------------- Datastores ----------------
  postgres:
    image: postgres:17-alpine
    container_name: uber-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - uber-pg:/var/lib/postgresql/data
      - ./docker/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uber-redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    container_name: uber-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Platform ----------------
  config-server:
    build: { context: ., dockerfile: config-server/Dockerfile }
    container_name: uber-config
    ports: ["8888:8888"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    build: { context: ., dockerfile: discovery-server/Dockerfile }
    container_name: uber-discovery
    ports: ["8761:8761"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Services ----------------
  rider-service:
    build: { context: ., dockerfile: rider-service/Dockerfile }
    container_name: uber-rider
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/riderdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  driver-service:
    build: { context: ., dockerfile: driver-service/Dockerfile }
    container_name: uber-driver
    ports: ["8082:8082"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/driverdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  location-service:
    build: { context: ., dockerfile: location-service/Dockerfile }
    container_name: uber-location
    ports: ["8083:8083"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  matching-service:
    build: { context: ., dockerfile: matching-service/Dockerfile }
    container_name: uber-matching
    ports: ["8084:8084"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  pricing-service:
    build: { context: ., dockerfile: pricing-service/Dockerfile }
    container_name: uber-pricing
    ports: ["8085:8085"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      redis: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  trip-service:
    build: { context: ., dockerfile: trip-service/Dockerfile }
    container_name: uber-trip
    ports: ["8086:8086"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tripdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  payment-service:
    build: { context: ., dockerfile: payment-service/Dockerfile }
    container_name: uber-payment
    ports: ["8087:8087"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  notification-service:
    build: { context: ., dockerfile: notification-service/Dockerfile }
    container_name: uber-notification
    ports: ["8088:8088"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      kafka: { condition: service_healthy }
      discovery-server: { condition: service_healthy }

  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    container_name: uber-gateway
    ports: ["8080:8080"]
    environment:
      EUREKA_URI: http://discovery-server:8761/eureka
    depends_on:
      discovery-server: { condition: service_healthy }

volumes:
  uber-pg:
